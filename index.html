<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Персональный книжный дневник, виртуальная книжная полка и аналитический дашборд для учёта прочитанных книг и анализа читательских привычек." />
    <meta property="og:title" content="My Book Shelf — Персональный книжный трекер" />
    <meta property="og:description" content="Персональный книжный дневник, виртуальная книжная полка и аналитический дашборд для учёта прочитанных книг и анализа читательских привычек." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Suppress Vite HMR WebSocket errors in iframe/preview environment
      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && (e.reason.message?.includes('WebSocket') || String(e.reason).includes('WebSocket'))) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        if (e.message && e.message.includes('WebSocket')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body class="bg-[#FAF8F5] text-[#24211D] antialiased min-h-screen selection:bg-[#EAE4DC] selection:text-[#181512]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
